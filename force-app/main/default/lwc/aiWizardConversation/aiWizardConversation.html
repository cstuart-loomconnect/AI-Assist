<template>
    <div class="grid">
        <section class="aic-card span2" aria-labelledby="s-load">
            <div class="aic-card__header"><h2 class="aic-card__title" id="s-load">Loading &amp; sessions</h2></div>
            <div class="aic-card__body">
                <fieldset class="radios">
                    <legend class="legend">Conversation Load Trigger</legend>
                    <template for:each={loadOptions} for:item="option">
                        <label key={option.value} class="radio"><input type="radio" class="aic-radio" name="lt" value={option.value} checked={option.checked} data-field="loadTrigger" onchange={handleInput} /><span class="text"><b>{option.label}</b><span>{option.description}</span></span></label>
                    </template>
                </fieldset>
                <fieldset class="radios">
                    <legend class="legend">Conversation Visibility</legend>
                    <template for:each={visibilityOptions} for:item="option">
                        <label key={option.value} class="radio"><input type="radio" class="aic-radio" name="vis" value={option.value} checked={option.checked} data-field="visibility" onchange={handleInput} /><span class="text"><b>{option.label}</b><span>{option.description}</span></span></label>
                    </template>
                </fieldset>
                <div class="rows">
                    <div class="trow"><span class="text grow"><b>Single Active Conversation Per Record</b><span>One open conversation per record for this agent.</span></span>
                        <button type="button" class="aic-switch" role="switch" aria-checked={singleChecked} aria-label="Single Active Conversation Per Record" data-field="singleActive" onclick={handleToggle}></button></div>
                    <div class="trow"><span class="text grow"><b>Allow Conversation Resume</b><span>Reopen a closed or timed-out conversation and carry on.</span></span>
                        <button type="button" class="aic-switch" role="switch" aria-checked={resumeChecked} aria-label="Allow Conversation Resume" data-field="allowResume" onclick={handleToggle}></button></div>
                    <div class="trow top"><span class="text grow"><b>Idle Timeout</b><span>Closes the conversation after this much inactivity.</span></span>
                        <div class="inline"><input class="slds-input small-number" type="number" min="1" aria-label="Idle Timeout Minutes" value={rules.idleTimeout} data-field="idleTimeout" oninput={handleNumber} /><span class="aic-weak">minutes</span></div></div>
                </div>
            </div>
        </section>

        <section class="aic-card" aria-labelledby="s-limits">
            <div class="aic-card__header"><h2 class="aic-card__title" id="s-limits">Limits &amp; cost</h2></div>
            <div class="aic-card__body">
                <div class="two">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="c-msg">Max Messages Per Conversation</label>
                        <input id="c-msg" class="slds-input" type="number" min="1" value={rules.maxMessages} data-field="maxMessages" oninput={handleNumber} />
                    </div>
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="c-tok">Max Tokens Per Conversation</label>
                        <input id="c-tok" class="slds-input" inputmode="numeric" value={maxTokensLabel} onchange={handleTokens} />
                    </div>
                </div>
                <fieldset class="radios">
                    <legend class="legend">Token Tracking Method</legend>
                    <template for:each={trackingOptions} for:item="option">
                        <label key={option.value} class="radio"><input type="radio" class="aic-radio" name="tt" value={option.value} checked={option.checked} data-field="tokenTracking" onchange={handleInput} /><span class="text"><b>{option.label}</b><span>{option.description}</span></span></label>
                    </template>
                </fieldset>
                <div class="note">When a limit is hit the chat starts a new conversation. Org budget: {budgetLabel} (<a href="#" onclick={handleOpenApp}>App Settings</a>). Each user’s own cap is in <a href="#" onclick={handleOpenUsers}>User Settings</a>.</div>
            </div>
        </section>

        <section class="aic-card" aria-labelledby="s-ret">
            <div class="aic-card__header"><h2 class="aic-card__title" id="s-ret">Retention</h2></div>
            <div class="aic-card__body">
                <div class="two">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="c-days">Conversation Retention Days</label>
                        <input id="c-days" class="slds-input" type="number" min="1" value={rules.retentionDays} data-field="retentionDays" oninput={handleNumber} />
                    </div>
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="c-trig">Retention Trigger</label>
                        <div class="slds-select_container">
                            <select id="c-trig" class="slds-select" data-field="retentionTrigger" onchange={handleInput}>
                                <template for:each={triggerOptions} for:item="option">
                                    <option key={option.value} value={option.value} selected={option.selected}>{option.value}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="example">
                    <c-ai-console-icon name="calendar" size="18" stroke-width="1.8"></c-ai-console-icon>
                    <template lwc:if={hasRetention}>
                        <span>A conversation {retentionVerb} on <b>{exampleStart}</b> is deleted on <b>{exampleEnd}</b>, with its messages and PII mappings.</span>
                    </template>
                    <template lwc:else><span>Set the days to see when conversations are deleted.</span></template>
                </div>
            </div>
        </section>
    </div>
</template>
