<template>
    <div class="page">
        <div class="header">
            <div class="aic-page-header__titles"><span class="aic-eyebrow">Settings · AI Assist UI Settings</span><h1 class="aic-page-title">{title}</h1></div>
            <lightning-button label="Cancel" onclick={handleCancel} disabled={isBusy}></lightning-button>
            <lightning-button variant="brand" label={saveLabel} onclick={handleSave} disabled={saveDisabled}></lightning-button>
        </div>

        <template lwc:if={error}>
            <div class="aic-banner aic-banner_error" role="alert"><c-ai-console-icon name="errorCircle" size="16"></c-ai-console-icon><span>{error}</span></div>
        </template>

        <section class="aic-card" aria-label="UI settings by level">
            <nav aria-label="Setting level" class="levels">
                <template for:each={levels} for:item="level">
                    <a key={level.value} href="#" class={level.linkClass} aria-current={level.current} data-level={level.value} onclick={handleLevel}>{level.label}</a>
                </template>
            </nav>
            <div class="owner">
                <template lwc:if={isOrgLevel}>
                    <span class="aic-weak grow">Every user gets these unless their profile or their own user setting says otherwise.</span>
                </template>
                <template lwc:else>
                    <div class="slds-form-element owner__select">
                        <label class="slds-form-element__label" for="u-owner">{ownerLabel}</label>
                        <div class="slds-select_container">
                            <select id="u-owner" class="slds-select" onchange={handleOwner}>
                                <template for:each={ownerChoices} for:item="option">
                                    <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <span class="aic-weak grow owner__note">{ownerNote}</span>
                    <span class="aic-weak owner__note"><b class="ink">{overriddenCount}</b> overridden here</span>
                </template>
            </div>

            <template lwc:if={isLoading}>
                <div class="aic-spinner-holder"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
            </template>
            <template lwc:else>
                <div class="row row_head"><span class="aic-caps">Setting</span><span class="aic-caps">Value</span><span class="aic-caps">Comes from</span></div>
                <template for:each={rows} for:item="row">
                    <div key={row.key} class={row.rowClass}>
                        <span class="tt"><b>{row.label}</b><span>{row.help}</span></span>
                        <div>
                            <template lwc:if={row.isToggle}>
                                <button type="button" class="aic-switch" role="switch" aria-checked={row.checked} aria-label={row.label} data-key={row.key} onclick={handleToggle}></button>
                            </template>
                            <template lwc:elseif={row.isRadio}>
                                <fieldset class="radios">
                                    <legend class="slds-assistive-text">{row.label}</legend>
                                    <template for:each={row.choices} for:item="choice">
                                        <label key={choice.value} class="radio"><input type="radio" class="aic-radio" name={row.key} value={choice.value} checked={choice.checked} data-key={row.key} onchange={handleRadio} />{choice.label}</label>
                                    </template>
                                </fieldset>
                            </template>
                            <template lwc:else>
                                <input class="slds-input number" type="number" min="1" max="200" aria-label={row.label} value={row.value} data-key={row.key} onchange={handleNumber} />
                            </template>
                        </div>
                        <span class="src">
                            <template lwc:if={row.isOverridden}>
                                <span class="overridden">Overridden</span>
                                <a href="#" data-key={row.key} onclick={handleReset}>{row.resetLabel}</a>
                            </template>
                            <template lwc:else>{row.sourceLabel}</template>
                        </span>
                    </div>
                </template>
            </template>
        </section>
    </div>
</template>
