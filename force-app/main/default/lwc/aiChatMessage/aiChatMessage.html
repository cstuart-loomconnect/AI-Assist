<template>
    <template lwc:if={message.isNotice}>
        <div class="notice" role="note">{message.noticeText}</div>
    </template>

    <!-- User message -->
    <template lwc:elseif={message.isUser}>
        <div class="user-row">
            <div class={userBubbleClass}>
                <template lwc:if={message.isCommand}>
                    <span class="aia-mono command">{message.commandName}</span><template lwc:if={message.commandRest}><span> {message.commandRest}</span></template>
                </template>
                <template lwc:else>{message.displayText}</template>
            </div>
            <template lwc:if={message.isBlocked}>
                <span class="not-sent">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
                    {labels.notSent}
                </span>
            </template>
            <template lwc:elseif={message.showTimestamp}>
                <span class="meta">{message.timeLabel}</span>
            </template>
        </div>
        <template lwc:if={message.isBlocked}>
            <div class="blocked-card" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3l9-16z"></path><path d="M12 10v4M12 17v.5"></path></svg>
                <div class="blocked-content">
                    <div class="aia-eyebrow blocked-eyebrow">{labels.blockedHeading}</div>
                    <div class="blocked-text">{message.blockedReason}</div>
                    <template lwc:if={isWhyOpen}>
                        <div class="blocked-text">{labels.blockedExplanation}</div>
                    </template>
                    <div class="blocked-actions">
                        <button type="button" class="blocked-edit" onclick={handleEditBlocked}>{labels.editMessage}</button>
                        <button type="button" class="blocked-why" aria-expanded={whyExpanded} onclick={toggleWhy}>{labels.blockedWhy}</button>
                    </div>
                </div>
            </div>
        </template>
    </template>

    <!-- AI Agent message -->
    <template lwc:else>
        <div class="agent">
            <template lwc:if={message.showAgentHeader}>
                <div class="agent-header">
                    <div class="agent-avatar" aria-hidden="true">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"></path></svg>
                    </div>
                    <span class="agent-name">{message.agentName}</span>
                </div>
            </template>

            <div class="agent-bubble">
                <lightning-formatted-rich-text class="rich" value={message.bodyHtml}></lightning-formatted-rich-text>
                <template lwc:if={message.hasSources}>
                    <div class="sources">
                        <span class="sources-label">{labels.sources}</span>
                        <template for:each={message.sources} for:item="source">
                            <span key={source.key} class="source-chip">{source.label}</span>
                        </template>
                    </div>
                </template>
            </div>

            <div class="toolbar">
                <template lwc:if={message.showFeedback}>
                    <button type="button" class={helpfulClass} aria-label={labels.helpful} title={labels.helpful} aria-pressed={helpfulPressed} onclick={handleHelpful}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill={helpfulFill} fill-opacity="0.15" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H3V10h4zM7 10l4-7c1.7 0 3 1.3 3 3v3h5.5a2 2 0 0 1 2 2.3l-1.2 8A2 2 0 0 1 18.3 21H7"></path></svg>
                    </button>
                    <button type="button" class={notHelpfulClass} aria-label={labels.notHelpful} title={labels.notHelpful} aria-pressed={notHelpfulPressed} onclick={handleNotHelpful}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill={notHelpfulFill} fill-opacity="0.15" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V3h4v11h-4zM17 14l-4 7c-1.7 0-3-1.3-3-3v-3H4.5a2 2 0 0 1-2-2.3l1.2-8A2 2 0 0 1 5.7 3H17"></path></svg>
                    </button>
                </template>
                <button type="button" class="aia-icon-btn aia-icon-btn_small tool" aria-label={copyLabel} title={copyLabel} onclick={handleCopy}>
                    <lightning-icon icon-name={copyIcon} size="xx-small"></lightning-icon>
                </button>
                <template lwc:if={message.canRegenerate}>
                    <button type="button" class="aia-icon-btn aia-icon-btn_small tool" aria-label={labels.regenerate} title={labels.regenerate} onclick={handleRegenerate}>
                        <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                    </button>
                </template>
                <template lwc:if={message.showTimestamp}>
                    <span class="meta toolbar-time">{message.timeLabel}</span>
                </template>
                <div class="grow"></div>
                <template lwc:if={message.tokenLabel}>
                    <span class="aia-mono meta">{message.tokenLabel}</span>
                </template>
            </div>

            <template lwc:if={message.feedbackThanks}>
                <div class="thanks" role="status">{labels.feedbackThanks}</div>
            </template>
            <template lwc:if={message.feedbackOpen}>
                <c-ai-chat-feedback-panel is-submitting={message.feedbackSubmitting} onsubmit={handleFeedbackSubmit} onskip={handleFeedbackSkip}></c-ai-chat-feedback-panel>
            </template>

            <template lwc:if={message.suggestedAction}>
                <c-ai-chat-suggested-action action={message.suggestedAction} display={message.actionsDisplay} state={message.actionState} onrun={handleRunAction} ondismiss={handleDismissAction}></c-ai-chat-suggested-action>
            </template>

            <template lwc:if={message.showTrace}>
                <c-ai-chat-debug-trace trace={message.trace} error-message={message.traceError} onviewpiimappings={handleViewPiiMappings} onclosetrace={handleCloseTrace}></c-ai-chat-debug-trace>
            </template>
            <template lwc:elseif={message.showTraceLink}>
                <button type="button" class="trace-link aia-mono" onclick={handleLoadTrace}>{labels.showTrace}</button>
            </template>
        </div>
    </template>
</template>
