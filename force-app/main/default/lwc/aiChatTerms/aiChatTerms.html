<template>
    <main class="terms">
        <div class="terms-intro">
            <div class="aia-eyebrow eyebrow-accent">{labels.termsEyebrow}</div>
            <h1 class="terms-heading">{labels.termsHeading}</h1>
        </div>

        <ul class="terms-points">
            <li class="terms-point">
                <div class="point-icon point-icon_success" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6F4A" stroke-width="1.8"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"></path></svg>
                </div>
                <div class="point-text">
                    <div class="point-title">{labels.termsPiiTitle}</div>
                    <div class="point-body">{labels.termsPiiBody}</div>
                </div>
            </li>
            <li class="terms-point">
                <div class="point-icon point-icon_accent" aria-hidden="true">
                    <lightning-icon icon-name="utility:info" size="x-small" class="accent-icon"></lightning-icon>
                </div>
                <div class="point-text">
                    <div class="point-title">{labels.termsWrongTitle}</div>
                    <div class="point-body">{labels.termsWrongBody}</div>
                </div>
            </li>
            <li class="terms-point">
                <div class="point-icon" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6270" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h4"></path></svg>
                </div>
                <div class="point-text">
                    <div class="point-title">{labels.termsLoggedTitle}</div>
                    <div class="point-body">{labels.termsLoggedBody}</div>
                </div>
            </li>
        </ul>

        <div class="spacer"></div>

        <div class="slds-form-element agree">
            <div class="slds-form-element__control">
                <div class="slds-checkbox">
                    <input type="checkbox" id="terms-agree" checked={isAgreed} onchange={handleAgreeChange} />
                    <label class="slds-checkbox__label" for="terms-agree">
                        <span class="slds-checkbox_faux"></span>
                        <span class="slds-form-element__label agree-text">
                            {labels.termsAgreePrefix}
                            <template lwc:if={policyUrl}>
                                <a href={policyUrl} target="_blank" rel="noopener noreferrer">{labels.termsPolicy}</a>
                            </template>
                            <template lwc:else>{labels.termsPolicy}</template>
                            {labels.termsAgreeSuffix}
                        </span>
                    </label>
                </div>
            </div>
        </div>

        <button type="button" class="aia-btn aia-btn_brand aia-btn_large" disabled={isAgreeDisabled} onclick={handleAgree}>
            {labels.termsAgree}
        </button>
        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error error" role="alert">{errorMessage}</p>
        </template>
    </main>
</template>
