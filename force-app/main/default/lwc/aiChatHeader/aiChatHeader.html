<template>
    <header class="header">
        
        <!-- Logo mark: grid icon, dims via logoClass/logoStroke when muted -->
        <div class={logoClass} aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={logoStroke} stroke-width="2" stroke-linecap="round">
                <path d="M4 8h16M4 16h16M8 4v16M16 4v16"></path>
            </svg>
        </div>

        <!-- Title + agent line: static label, or switcher when multiple agents -->
        <div class="titles">
            <div class={titleClass}>{title}</div>
            <template lwc:if={showAgentLine}>

                <template lwc:if={canSwitchAgent}>

                    <!-- Agent switcher trigger + dropdown -->
                    <div class="agent-picker" onfocusout={handlePickerFocusOut} onkeydown={handlePickerKeyDown}>

                        <button type="button" class="agent-trigger" aria-haspopup="true" aria-expanded={agentMenuExpanded} title={labels.switchAgent} onclick={toggleAgentMenu}>
                            <span class="slds-truncate">{agentName}</span>
                            <lightning-icon icon-name="utility:chevrondown" size="xx-small" class="agent-chevron"></lightning-icon>
                        </button>

                        <!-- Agent options list, checkmark on the active agent -->
                        <template lwc:if={isAgentMenuOpen}>
                            <div class="slds-dropdown slds-dropdown_left agent-menu">
                                <ul class="slds-dropdown__list" role="menu" aria-label={labels.switchAgent}>
                                    <template for:each={agentOptions} for:item="agent">
                                        <li key={agent.id} class="slds-dropdown__item" role="presentation">
                                            <button type="button" class="agent-option" role="menuitemradio" aria-checked={agent.checked} data-id={agent.id} onclick={handleAgentSelect}>
                                                <span class="agent-option-check">
                                                    <template lwc:if={agent.isSelected}>
                                                        <lightning-icon icon-name="utility:check" size="xx-small" class="accent-icon"></lightning-icon>
                                                    </template>
                                                </span>
                                                <span class="slds-grid slds-grid_vertical agent-option-text">
                                                    <span class="slds-truncate agent-option-name">{agent.name}</span>
                                                    <template lwc:if={agent.description}>
                                                        <span class="slds-truncate agent-option-description">{agent.description}</span>
                                                    </template>
                                                </span>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                    </div>
                    
                </template>

                <!-- Single agent: plain label, no switcher -->
                <template lwc:else>
                    <div class="agent-static slds-truncate">{agentName}</div>
                </template>
            </template>
        </div>

        <!-- Status pill: debug / maintenance / off -->
        <template lwc:if={badgeLabel}>
            <span class={badgeClass}>
                <template lwc:if={isDebugBadge}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"></path></svg>
                </template>
                {badgeLabel}
            </span>
        </template>

        <!-- New conversation button -->
        <template lwc:if={showNew}>
            <button type="button" class="aia-icon-btn" aria-label={newLabel} title={newLabel} disabled={newDisabled} onclick={handleNew}>
                <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
            </button>
        </template>
        <!-- History button -->
        <template lwc:if={showHistory}>
            <button type="button" class="aia-icon-btn" aria-label={labels.history} title={labels.history} onclick={handleHistory}>
                <lightning-icon icon-name="utility:history" size="x-small"></lightning-icon>
            </button>
        </template>
        <!-- Overflow menu (More options) -->
        <template lwc:if={hasMenuItems}>
            <lightning-button-menu class="more-menu" icon-name="utility:threedots_vertical" alternative-text={labels.moreOptions} title={labels.moreOptions} variant="bare" menu-alignment="right" onselect={handleMenuSelect}>
                <template for:each={menuItems} for:item="item">
                    <lightning-menu-item key={item.value} value={item.value} label={item.label} prefix-icon-name={item.iconName}></lightning-menu-item>
                </template>
            </lightning-button-menu>
        </template>
    </header>
</template>
